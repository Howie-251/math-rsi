<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="source-path" content="{{SOURCE_PATH}}">
<meta name="source-sha256" content="{{SOURCE_SHA256}}">
<meta name="generated-at" content="{{GENERATED_AT}}">
<title>{{TITLE}}</title>
<style>
:root{--paper:#fcfbf7;--white:#fff;--ink:#172535;--muted:#495966;--rule:#dce3e5;--accent:#1d6367;--soft:#eaf3f1;--warning:#8b551a;--warning-bg:#faf1df;color-scheme:light;--text-font:"Times New Roman","SimSun","Songti SC","Noto Serif CJK SC",serif;--heading-font:"Times New Roman","Microsoft YaHei","Noto Sans CJK SC",serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.8 var(--text-font);overflow-wrap:anywhere}
a{color:var(--accent);text-underline-offset:.17em}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
header{border-bottom:1px solid var(--rule);background:var(--white)}.header-inner{max-width:1290px;margin:auto;padding:50px 32px 42px}.eyebrow{font:600 .78rem/1.4 var(--heading-font);letter-spacing:.12em;color:var(--accent)}
h1,h2,h3,h4{line-height:1.35;font-family:var(--heading-font)}h1{font-size:clamp(2rem,5vw,3.35rem);margin:.35rem 0 .65rem;letter-spacing:-.018em}h2{font-size:1.65rem;margin:2.9rem 0 .9rem;scroll-margin-top:1.4rem;padding-top:.8rem;border-top:1px solid var(--rule)}h3{font-size:1.23rem;margin:1.9rem 0 .5rem}h4{font-size:1.05rem;margin:1.5rem 0 .4rem}
.dek{max-width:55rem;color:var(--muted);margin:.65rem 0 0;font-size:1rem}
.results{max-width:740px;margin-top:1.45rem}.results h2{font-size:1.25rem;margin:0;padding:0;border:0}.results .table-scroll{margin:.55rem 0}.results p{font-size:.92rem;line-height:1.65;margin:.7rem 0 0;color:var(--muted)}.results td:first-child,.results td:nth-child(2){white-space:nowrap}.results td:nth-child(2){font-weight:bold}
.layout{max-width:1290px;margin:auto;padding:0 32px 55px;display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:45px}.toc{align-self:start;position:sticky;top:24px;margin-top:35px;padding-right:18px;border-right:1px solid var(--rule);max-height:calc(100vh - 48px);overflow:auto;font: .84rem/1.55 var(--heading-font)}.toc strong{display:block;margin-bottom:.6rem;color:var(--muted)}.toc ol,.toc ul{list-style:none;margin:0;padding-left:0}.toc li{margin:.45em 0}.toc .toc-sub{padding-left:1em}.toc a{text-decoration:none}.toc a:hover{text-decoration:underline}.toc img{max-width:100%}
main{min-width:0;max-width:940px;padding-top:20px}main>h2:first-child{margin-top:.65rem}p{margin:.82rem 0}ul,ol{padding-left:1.7rem}li{padding-left:.15rem}strong{font-weight:700}
blockquote,.callout{margin:1.25rem 0;padding:.45rem 1.05rem;background:var(--soft);border-left:4px solid var(--accent);border-radius:0 5px 5px 0}.callout-warn{background:var(--warning-bg);border-color:var(--warning)}.callout-title{font-weight:700}
code,pre{font-family:var(--text-font);font-size:.85em}code{background:#edf1f0;padding:.12em .28em;border-radius:3px}pre{overflow:auto;background:#eef2f1;padding:1rem}pre code{background:transparent;padding:0}
.table-scroll{overflow-x:auto;margin:1.2rem 0}table{border-collapse:collapse;width:100%;font-size:.91em;background:var(--white)}thead{background:#e9f0ef}th,td{padding:.6rem .72rem;text-align:left;border:1px solid var(--rule);vertical-align:top}th{font-weight:650}tr:nth-child(even){background:#f8faf9}.working-cell{background:var(--warning-bg);color:#714511;font-weight:650}.capacity-cell{background:var(--soft);color:var(--accent);font-weight:650}
.math-inline{display:inline-block;max-width:100%;object-fit:contain}.math-display{display:block;overflow-x:auto;text-align:center;padding:.55rem .25rem;margin:.8rem 0}.math-display img{display:block;margin:auto;max-width:100%}.math-display img,.math-inline{user-select:all}
figure{margin:1.5rem 0;background:var(--white);border:1px solid var(--rule);border-radius:7px;padding:.8rem}figure svg{display:block;width:100%;height:auto}figcaption{font-size:.88rem;color:var(--muted);padding:.45rem .35rem 0;line-height:1.65}svg text{font-family:var(--heading-font)}
details{margin:1rem 0;border:1px solid var(--rule);background:var(--white);border-radius:5px;padding:.65rem .9rem}summary{cursor:pointer;font-weight:650}footer{padding:1rem 0;border-top:1px solid var(--rule);margin-top:2rem;font-size:.8rem;color:var(--muted)}
@media(max-width:780px){.header-inner{padding:34px 20px 28px}.layout{display:block;padding:0 18px 30px}.toc{position:static;border-right:0;border-bottom:1px solid var(--rule);padding:0 0 .85rem;margin:1rem 0;max-height:none}.toc li{margin:.3em 0}.toc ol ul{display:none}main{padding-top:.1rem}th,td{padding:.42rem .5rem}figure{padding:.35rem}.math-display{text-align:left}.math-display img{margin-inline:auto}}
@media print{body,header,figure,table,details{background:#fff!important}body{font-size:10.5pt;line-height:1.55}.header-inner,.layout{padding:0;max-width:none}.layout{display:block}.toc{display:none}main{max-width:none;padding:0}h1{font-size:24pt}h2{font-size:16pt;margin-top:1.6rem}h2,h3,h4{break-after:avoid}figure,.math-display,.results{break-inside:avoid}a{color:inherit;text-decoration:none}thead{display:table-header-group}tr{break-inside:avoid}.table-scroll{overflow:visible}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="eyebrow">组合几何 · 研究工作报告</div><h1>{{TITLE}}</h1><p class="dek">{{DEK}}</p><section class="results" aria-labelledby="当前上界">{{RESULTS}}</section></div></header>
<div class="layout"><nav class="toc" aria-label="目录"><strong>目录</strong>{{TOC}}</nav><main id="reading">{{BODY}}</main></div>
</body>
</html>
