  <text x="927.0" y="418.0" font-size="22" fill="#142235" text-anchor="start">Degree–diameter</text>
  <text x="374.0" y="460.0" font-size="22" fill="#142235" text-anchor="start">Hypercube extremal</text>
  <text x="625.0" y="460.0" font-size="22" fill="#142235" text-anchor="start">Hypercube Hamilton</text>
  <text x="927.0" y="460.0" font-size="22" fill="#142235" text-anchor="start">Happy Ending</text>
  <text x="374.0" y="505.0" font-size="19" fill="#5A6677" text-anchor="start">Base calls domain methods &amp; checkers; scoped evidence returns.</text>
