  <text x="374.0" y="261.0" font-size="19" fill="#5A6677" text-anchor="start">Agent collaboration · Adversarial review · Global progress checks</text>
  <text x="374.0" y="297.0" font-size="19" fill="#5A6677" text-anchor="start">Evidence determines the entry stage and targeted returns.</text>
