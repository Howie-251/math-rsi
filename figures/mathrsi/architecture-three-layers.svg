  <text x="48.0" y="112.0" font-size="25" fill="#5A6677" text-anchor="start">Three layers for mathematical research</text>
  <text x="78.0" y="188.0" font-size="18" fill="#2563EB" text-anchor="start">01</text>
  <text x="78.0" y="226.0" font-size="24" fill="#142235" text-anchor="start">BASE WORKFLOW</text>
